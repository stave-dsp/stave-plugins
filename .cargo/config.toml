# Apple Silicon shipping baseline: every AS Mac is >= M1, so
# apple-m1 tuning is safe to DISTRIBUTE (never -Ctarget-cpu=native,
# which pins artifacts to the build machine's exact core). Measured
# 2026-07-06 on the eddy engine, ns/frame, repeats: PRISM 381→357
# (-6.3%), CIRCUIT 94.2→91.5 (-2.6%), PLATE/SHIFT within noise.
# Fat LTO was measured the same day and REJECTED: no gain over thin
# (cross-crate inlining already saturated), slower builds.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

# Plugins built and run by cargo (tests, stave-play) log here, not into
# the user's log directory.
[env]
STAVE_LOG_DIR = { value = "target/logs", relative = true }

# Fetch the framework with the git CLI so private-repo credentials
# (gh, keychain, CI's deploy key) work the way plain `git` does.
[net]
git-fetch-with-cli = true

# Tests that link several plugins (conformance, anvil→tolex) carry every
# plugin's `stave::export!` entry points (`clap_entry`,
# `GetPluginFactory`, …). Only a plugin's own cdylib calls them, so the
# linker keeps the first definition. macOS's linker never pulls the
# duplicates in.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/FORCE:MULTIPLE"]
