# Linux and Windows: every plugin builds, lints and passes its tests
# there too (the framework's ledger X: docs/overhaul.md in
# stave-dsp/stave). macOS, the validators and the bundles are ci.yml's.
name: platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev xvfb
      - run: rustup toolchain install   # the pinned toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: nextest@0.9.148 }
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings
      - name: cargo nextest run
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" cargo nextest run --workspace --locked --profile ci
          else
            cargo nextest run --workspace --locked --profile ci
          fi
