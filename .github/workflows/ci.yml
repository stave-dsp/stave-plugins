# CI for the plugin suite. The framework is a cargo git dependency pinned
# to a release tag of github.com/stave-dsp/stave (Cargo.lock records the
# commit), so builds are --locked. While the framework repo is private,
# jobs fetch it with a read-only deploy key (secret STAVE_DEPLOY_KEY, set
# up by scripts/ci-framework-access.sh); once it is public, revoke it and
# that step skips itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HAS_FRAMEWORK_KEY: ${{ secrets.STAVE_DEPLOY_KEY != '' }}

jobs:
  # The tree's own rules: shell only, no build.
  rules:
    name: tree rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Framework is pinned, not linked
        run: "! grep -q '>>> link-framework' Cargo.toml || { echo 'Cargo.toml has a local link-framework block: run scripts/link-framework.sh --off'; exit 1; }"
      - run: scripts/check-file-sizes.sh
      - run: scripts/check-view-bindings.sh
      - run: scripts/check-plugin-rules.sh

  # macOS (the plugins' first platform, and the only arm64 one) runs
  # every test, lint and doctest. The packages are split three ways
  # (scripts/ci-shard.py): each shard builds and tests only its own, so
  # the build divides along with the tests. One nextest build serves the
  # tests; clippy and the doctests reuse its dependencies.
  test:
    name: build + clippy + test (macOS ${{ matrix.shard }}/3)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Framework access (private repo only)
        if: env.HAS_FRAMEWORK_KEY == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: "${{ secrets.STAVE_DEPLOY_KEY }}" }
      - name: Fetch the framework over SSH (private repo only)
        if: env.HAS_FRAMEWORK_KEY == 'true'
        run: git config --global url."git@github.com:stave-dsp/stave".insteadOf "https://github.com/stave-dsp/stave"
      # The pinned toolchain from rust-toolchain.toml, and only it: the
      # cache key hashes every installed toolchain, so the image's own
      # stable would turn every cache cold whenever the image updates it.
      - run: rustup toolchain install && rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "shard-${{ matrix.shard }}-of-3", cache-on-failure: true }
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: nextest@0.9.148 }
      - name: This shard's packages
        run: echo "PACKAGES=$(python3 scripts/ci-shard.py ${{ matrix.shard }}/3)" | tee -a "$GITHUB_ENV"
      - run: cargo nextest run $PACKAGES --locked --profile ci
      - run: cargo clippy $PACKAGES --all-targets --no-deps --locked -- -D warnings
      - run: cargo test $PACKAGES --doc --locked

  # The formats' own validators over every plugin's bundle, from one
  # release build: Steinberg's validator (the SDK is MIT) and clap-validator.
  validators:
    name: VST3 + CLAP validators (every plugin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Framework access (private repo only)
        if: env.HAS_FRAMEWORK_KEY == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: "${{ secrets.STAVE_DEPLOY_KEY }}" }
      - name: Fetch the framework over SSH (private repo only)
        if: env.HAS_FRAMEWORK_KEY == 'true'
        run: git config --global url."git@github.com:stave-dsp/stave".insteadOf "https://github.com/stave-dsp/stave"
      # The pinned toolchain from rust-toolchain.toml, and only it: the
      # cache key hashes every installed toolchain, so the image's own
      # stable would turn every cache cold whenever the image updates it.
      - run: rustup toolchain install && rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
      - name: Install clap-validator
        run: command -v clap-validator || cargo install --locked --git https://github.com/free-audio/clap-validator.git --tag 0.4.1 clap-validator
      - name: Cache VST3 SDK build
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: vst3sdk
          key: vst3sdk-validator-${{ runner.os }}-v3.8.1_build_84
      - name: Build Steinberg validator
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3sdk/build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk/build --target validator -j3
      - run: scripts/validate-formats.sh all
        env:
          VALIDATOR: vst3sdk/build/bin/Release/validator
