[workspace]
resolver = "2"
members = [
    "plugins/aeolian",
    "plugins/anvil",
    "plugins/chime",
    "plugins/dynamo",
    "plugins/eddy",
    "plugins/engram",
    "plugins/forge",
    "plugins/halo",
    "plugins/heirloom",
    "plugins/multiband-comp",
    "plugins/opal",
    "plugins/revenant",
    "plugins/ribbon",
    "plugins/saga",
    "plugins/smear",
    "plugins/tolex",
    "plugins/vault",
    "plugins/multiband-comp/profile",
    "conformance",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Ryan Bahan <ryan@ryanbahan.com>"]
repository = "https://github.com/stave-dsp/stave-plugins"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
ptr_cast_constness = "deny"
# Every `unsafe` block names the invariant that makes it sound; every
# `unsafe fn` states its contract.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# DSP loops index several parallel buffers with one counter; zip chains read worse.
needless_range_loop = "allow"

[workspace.dependencies]
# The framework, from a sibling checkout of github.com/stave-dsp/stave
# (clone both repos side by side; CI does the same).
libc = "0.2"
stave-ui = { path = "../stave/crates/stave-ui" }
stave-ui-cocoa = { path = "../stave/crates/stave-ui-cocoa" }
stave-raster = { path = "../stave/crates/stave-raster" }
stave-macros = { path = "../stave/crates/stave-macros" }
stave-core = { path = "../stave/crates/stave-core" }
stave-clap = { path = "../stave/crates/stave-clap" }
stave-vst3 = { path = "../stave/crates/stave-vst3" }
stave-debug = { path = "../stave/crates/stave-debug" }
stave-dsp = { path = "../stave/crates/stave-dsp" }
stave-test = { path = "../stave/crates/stave-test" }
stave-host = { path = "../stave/crates/stave-host" }
stave-measure = { path = "../stave/crates/stave-measure" }
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: the format wrappers catch a plugin panic at the entry
# point (`PanicGuard`) so it silences the instance instead of the DAW.
strip = "symbols"

[profile.dev]
opt-level = 1
# No debuginfo: on macOS ("unpacked") every build otherwise leaves its
# object files in target/debug/deps for the debugger, never collected —
# half a million files made a no-op cargo call take seconds to minutes.
# Panics still name functions; for a debugger session build with
# `--profile debugging`.
debug = false

[profile.debugging]
inherits = "dev"
debug = true
