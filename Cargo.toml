[workspace]
resolver = "2"
members = [
    "plugins/aeolian",
    "plugins/anvil",
    "plugins/chime",
    "plugins/dynamo",
    "plugins/eddy",
    "plugins/engram",
    "plugins/forge",
    "plugins/halo",
    "plugins/heirloom",
    "plugins/multiband-comp",
    "plugins/opal",
    "plugins/revenant",
    "plugins/ribbon",
    "plugins/saga",
    "plugins/smear",
    "plugins/tolex",
    "plugins/vault",
    "plugins/multiband-comp/profile",
    "conformance",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Ryan Bahan <ryan@ryanbahan.com>"]
repository = "https://github.com/stave-dsp/stave-plugins"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
ptr_cast_constness = "deny"
# Every `unsafe` block names the invariant that makes it sound; every
# `unsafe fn` states its contract.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# DSP loops index several parallel buffers with one counter; zip chains read worse.
needless_range_loop = "allow"

[workspace.dependencies]
# The framework, pinned to a release tag of github.com/stave-dsp/stave
# (or, between releases, the commit the plugins were validated against).
# Upgrade with scripts/bump-framework.sh (all together). To co-edit a
# sibling checkout at ../stave instead, see scripts/link-framework.sh.
libc = "0.2"
stave = { git = "https://github.com/stave-dsp/stave", tag = "v0.3.0" }
stave-dsp = { git = "https://github.com/stave-dsp/stave", tag = "v0.3.0" }
stave-host = { git = "https://github.com/stave-dsp/stave", tag = "v0.3.0" }
stave-measure = { git = "https://github.com/stave-dsp/stave", tag = "v0.3.0" }
stave-test = { git = "https://github.com/stave-dsp/stave", tag = "v0.3.0" }
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: the format wrappers catch a plugin panic at the entry
# point (`PanicGuard`) so it silences the instance instead of the DAW.
strip = "symbols"

[profile.dev]
opt-level = 1
# No debuginfo: on macOS ("unpacked") every build otherwise leaves its
# object files in target/debug/deps for the debugger, never collected —
# half a million files made a no-op cargo call take seconds to minutes.
# Panics still name functions; for a debugger session build with
# `--profile debugging`.
debug = false

# Dependencies (the framework among them) optimized even in dev: the
# face laws lay a face out hundreds of times and the validation checks
# run seconds of audio, so an unoptimized framework made a plugin's test
# run minutes instead of seconds. Plugin crates stay at opt-level 1.
[profile.dev.package."*"]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true
